name: Package OceanBase Plugin

on:
  workflow_dispatch:  # 允许手动触发
  push:
    branches:
      - test-oceanbase-ci  # 只在测试分支上触发
    paths:
      - '.github/workflows/package-oceanbase-plugin.yaml'  # 当此文件更新时触发

env:
  OCEANBASE_REPO: https://github.com/oceanbase/dify-plugin-oceanbase.git
  PLUGIN_NAME: dify-plugin-oceanbase

jobs:
  package-oceanbase-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Current Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12.7

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
          
          # 安装jq用于JSON解析
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Download Dify Plugin CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 创建scripts目录
          mkdir -p .scripts
          
          # 下载最新版本的dify-plugin CLI工具
          # 根据操作系统和架构选择合适的版本
          ARCH=$(uname -m)
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          
          if [ "$ARCH" = "x86_64" ]; then
            ARCH="amd64"
          elif [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            ARCH="arm64"
          fi
          
          if [ "$OS" = "linux" ]; then
            OS="linux"
          elif [ "$OS" = "darwin" ]; then
            OS="darwin"
          fi
          
          # 下载对应的二进制文件
          BINARY_NAME="dify-plugin-${OS}-${ARCH}"
          echo "Downloading $BINARY_NAME"
          
          # 使用GitHub API获取最新版本，使用jq解析JSON
          LATEST_VERSION=$(curl -s https://api.github.com/repos/langgenius/dify-plugin-daemon/releases/latest | jq -r '.tag_name')
          echo "Latest version: $LATEST_VERSION"
          
          # 检查版本号是否为空
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            echo "Failed to get latest version, using fallback method"
            # 使用gh命令作为备选方案
            LATEST_VERSION=$(gh release list -R langgenius/dify-plugin-daemon --limit 1 --json tagName --jq '.[0].tagName')
            echo "Fallback version: $LATEST_VERSION"
          fi
          
          # 如果还是获取不到版本，使用一个已知的版本
          if [ -z "$LATEST_VERSION" ] || [ "$LATEST_VERSION" = "null" ]; then
            LATEST_VERSION="v0.0.1b64"
            echo "Using hardcoded version: $LATEST_VERSION"
          fi
          
          # 下载二进制文件
          DOWNLOAD_URL="https://github.com/langgenius/dify-plugin-daemon/releases/download/${LATEST_VERSION}/${BINARY_NAME}"
          echo "Download URL: $DOWNLOAD_URL"
          
          # 下载文件并检查是否成功
          if curl -L -o ".scripts/${BINARY_NAME}" "$DOWNLOAD_URL"; then
            chmod +x ".scripts/${BINARY_NAME}"
            
            # 创建符号链接以便使用
            ln -sf "${BINARY_NAME}" .scripts/dify
            
            echo "Dify CLI downloaded successfully"
            .scripts/dify version
          else
            echo "Failed to download Dify CLI"
            exit 1
          fi

      - name: Clone OceanBase Plugin Repository
        run: |
          # 创建临时目录
          mkdir -p temp
          
          # 克隆OceanBase插件仓库
          echo "Cloning OceanBase plugin repository..."
          git clone ${{ env.OCEANBASE_REPO }} temp/${{ env.PLUGIN_NAME }}
          
          # 显示仓库信息
          cd temp/${{ env.PLUGIN_NAME }}
          echo "Repository cloned successfully"
          echo "Current branch: $(git branch --show-current)"
          echo "Latest commit: $(git log -1 --oneline)"
          ls -la

      - name: Package Plugin
        run: |
          # 显示插件目录内容
          echo "Plugin directory contents:"
          ls -la temp/${{ env.PLUGIN_NAME }}
          
          # 使用dify plugin package命令打包插件（需要在插件目录外部执行）
          echo "Packaging plugin..."
          .scripts/dify plugin package temp/${{ env.PLUGIN_NAME }}
          
          # 检查打包结果（打包文件生成在当前目录）
          if [ -f "${{ env.PLUGIN_NAME }}.difypkg" ]; then
            echo "Plugin packaged successfully!"
            ls -la *.difypkg
            echo "Package size: $(du -h *.difypkg | cut -f1)"
          else
            echo "Error: Plugin packaging failed!"
            echo "Available files in current directory:"
            ls -la
            echo "Available files in temp directory:"
            ls -la temp/
            exit 1
          fi

      - name: Create OceanBase Directory
        run: |
          # 在当前仓库中创建oceanbase目录
          mkdir -p oceanbase
          
          # 检查打包文件是否存在
          echo "Checking for packaged file..."
          if [ -f "${{ env.PLUGIN_NAME }}.difypkg" ]; then
            echo "Found packaged file: ${{ env.PLUGIN_NAME }}.difypkg"
            ls -la ${{ env.PLUGIN_NAME }}.difypkg
            
            # 复制打包好的插件到oceanbase目录
            cp ${{ env.PLUGIN_NAME }}.difypkg oceanbase/
            echo "Plugin copied to oceanbase directory"
            ls -la oceanbase/
          else
            echo "ERROR: Packaged file not found!"
            echo "Current directory contents:"
            ls -la
            echo "Looking for files with .difypkg extension:"
            find . -name "*.difypkg" -type f
            exit 1
          fi

      - name: Commit and Push Changes to Main Branch
        run: |
          # 配置git用户信息
          git config --local user.email "xxsc0529@163.com"
          git config --local user.name "xxsc0529"
          
          # 显示当前状态
          echo "Current git status:"
          git status
          
          echo "Checking oceanbase directory:"
          ls -la oceanbase/
          
          # 检查oceanbase目录是否存在且有文件
          if [ -d "oceanbase" ] && [ "$(ls -A oceanbase)" ]; then
            echo "oceanbase directory exists and has files"
            echo "Files in oceanbase directory:"
            ls -la oceanbase/
            
            # 检查文件是否已经被git跟踪
            echo "Checking if files are already tracked:"
            git ls-files oceanbase/
            
            # 检查文件是否被忽略
            echo "Checking if files are ignored:"
            git check-ignore -v oceanbase/* || echo "Files are not ignored"
            
            # 检查git状态
            echo "Git status for oceanbase directory:"
            git status --porcelain oceanbase/
            
            # 检查是否有变更需要提交
            echo "Checking for changes to commit:"
            git diff --name-only
            git diff --cached --name-only
            git ls-files --others --exclude-standard
            
            # 如果文件已经被跟踪，检查是否有修改
            if git ls-files oceanbase/ > /dev/null 2>&1; then
              echo "Files are already tracked, checking for modifications..."
              if git diff --quiet oceanbase/ && git diff --cached --quiet oceanbase/; then
                echo "No changes detected in tracked files"
                # 检查是否有新的未跟踪文件
                if [ -z "$(git ls-files --others --exclude-standard oceanbase/)" ]; then
                  echo "No untracked files in oceanbase directory"
                  echo "Nothing to commit"
                else
                  echo "Found untracked files, adding them..."
                  git add oceanbase/
                fi
              else
                echo "Changes detected, adding them..."
                git add oceanbase/
              fi
            else
              echo "Files are not tracked, adding them..."
              git add oceanbase/
            fi
            
            # 检查是否有文件被暂存
            echo "Checking staged files:"
            git diff --cached --name-only
            
            if git diff --cached --quiet; then
              echo "No files staged for commit"
              echo "Current git status:"
              git status
              echo "This might mean files are already up to date"
              echo "Proceeding with commit anyway to ensure consistency..."
            fi
            
            # 提交变更（即使没有变更也要提交，确保状态一致）
            git commit -m "feat: update OceanBase plugin package [skip ci]" --allow-empty
            
            # 推送到main分支
            echo "Pushing changes to main branch..."
            
            # 先获取远程main分支的最新状态
            echo "Fetching latest main branch..."
            git fetch origin main
            
            # 检查main分支的状态
            echo "Checking main branch status..."
            git log --oneline origin/main -5
            
            # 尝试推送到main分支，如果失败则使用force push
            if git push origin HEAD:main; then
              echo "Changes pushed successfully to main branch"
            else
              echo "Normal push failed, trying force push..."
              git push origin HEAD:main --force
              echo "Changes force pushed successfully to main branch"
            fi
          else
            echo "ERROR: oceanbase directory is empty or doesn't exist"
            echo "Current directory contents:"
            ls -la
            echo "Looking for .difypkg files:"
            find . -name "*.difypkg" -type f
            exit 1
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oceanbase-plugin-package
          path: oceanbase/*.difypkg
          retention-days: 30

      - name: Cleanup
        run: |
          # 清理临时文件
          rm -rf temp
          rm -rf .scripts
          echo "Cleanup completed"

      - name: Summary
        run: |
          echo "## OceanBase Plugin Packaging Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Status**: Successfully packaged OceanBase plugin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Package Location**: \`oceanbase/dify-plugin-oceanbase.difypkg\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌿 **Branch**: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔄 **Trigger**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📅 **Timestamp**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
# Trigger CI
